name: OpsDesk CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # Quality Gate 1: Automated Testing & Lints
  # ==========================================
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          pytest backend/ -v --tb=short

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Compile
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  terraform-validate:
    name: Terraform IaC Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format Check
        run: terraform fmt -check terraform/

      - name: Terraform Init
        run: cd terraform && terraform init -backend=false

      - name: Terraform Validate
        run: cd terraform && terraform validate

  # ==========================================
  # Quality Gate 2: Docker Builds & DevSecOps
  # ==========================================
  docker-build-scan-push:
    name: Docker Image Build, Trivy Scan & GHCR Push
    needs: [backend-test, frontend-build, terraform-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${OWNER_LC}/opsdesk-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER_LC}/opsdesk-frontend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Backend Image
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      # DevSecOps: Trivy Security Vulnerability Scan on Backend
      - name: Trivy Scan Backend Image (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Build Frontend Image
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      # DevSecOps: Trivy Scan Frontend Image (DevSecOps)
      - name: Trivy Scan Frontend Image (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push Images with Git SHA Tags (Immutable Promotion)
      - name: Push Backend Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_BACKEND }}:${{ github.sha }} ${{ env.IMAGE_BACKEND }}:latest
          docker push ${{ env.IMAGE_BACKEND }}:latest

      - name: Push Frontend Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} ${{ env.IMAGE_FRONTEND }}:latest
          docker push ${{ env.IMAGE_FRONTEND }}:latest

  # ==========================================
  # Quality Gate 3: Kubernetes & Helm Deploy
  # ==========================================
  k8s-helm-deployment:
    name: Kubernetes & Helm Deployment Verification
    needs: [docker-build-scan-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: opsdesk-ci

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy OpsDesk Helm Chart
        run: |
          helm upgrade --install opsdesk ./helm/opsdesk/ \
            --namespace opsdesk \
            --set postgresql.persistence.size=1Gi \
            --set ingress.enabled=false

      - name: Verify Kubernetes Workloads & Services
        run: |
          kubectl get all -n opsdesk
          helm list -n opsdesk
